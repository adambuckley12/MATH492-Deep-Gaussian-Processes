project:
  type: manuscript

manuscript:
  article: index.qmd
  notebooks: []

number-sections: true
toc: true
toc-depth: 2
reference-section-title: "References"
link-citations: true

format:
  html: default
  docx: default
  jats: default

  # (other formats)
  pdf:
    pdf-engine: pdflatex
    include-in-header: _macros.tex
    notebook-links: false
    geometry:
      - a4paper
      - textwidth=15cm
      - "textheight=42\\baselineskip"
      - centering
  typst:
    include-in-header: _macros.typ

filters:
  - expand-macros.lua

execute:
  freeze: auto
  cache: true